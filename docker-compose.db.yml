services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: life_sandbox_dev
      POSTGRES_USER: life_sandbox
      POSTGRES_PASSWORD: local_dev_only_change_me
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U life_sandbox -d life_sandbox_dev"]
      interval: 3s
      timeout: 3s
      retries: 20