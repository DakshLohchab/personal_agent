[project]
name = "life-sandbox"
version = "0.1.0"
description = "Offline deterministic life decision simulation engine"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.14,<2",
    "boto3>=1.35,<2",
    "botocore>=1.35,<2",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "numpy>=2.2,<3",
    "openai>=1.109,<2",
    "pgvector>=0.3,<1",
    "pydantic>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.54.0",
    "nvidia-nat==1.8.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "hypothesis>=6.120,<7",
    "pyright>=1.1.390,<2",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[project.entry-points."nat.components"]
life_sandbox_phase5 = "services.agents.nat_components"

[tool.setuptools.packages.find]
include = ["packages*", "services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
include = ["packages", "services"]
