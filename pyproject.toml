[project]
name = "life-sandbox"
version = "0.1.0"
description = "Offline deterministic life decision simulation engine"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "numpy>=2.2,<3",
    "pgvector>=0.3,<1",
    "pydantic>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.120,<7",
    "pyright>=1.1.390,<2",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
include = ["packages", "services"]
